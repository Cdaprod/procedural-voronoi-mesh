[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "procedural-voronoi-mesh"
version = "1.0.0"
description = "Deterministic Voronoi relief meshes, reproducible exports and validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "David Cannan (Cdaprod)"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "trimesh>=4.4,<6", "manifold3d>=3,<4", "PyYAML>=6,<7", "matplotlib>=3.8,<4", "Pillow>=10,<13", "networkx>=3,<4"]
[project.optional-dependencies]
validation = ["libigl>=2.6,<3"]
dev = ["pytest>=8,<10", "build", "ruff>=0.9"]
[project.scripts]
voronoi-mesh = "procedural_voronoi.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
procedural_voronoi = ["presets.yaml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
